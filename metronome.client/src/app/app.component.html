@if (isLoading) {
  <div>Loading...</div>
} @else {
  @if (isLoggedIn) {
    <div class="menu">
      <button matButton (click)="navigate('')">Home</button>
      <button matButton (click)="navigate('composers')">Composers</button>
      <button matButton (click)="navigate('scores')">
        Scores / Metronomes
      </button>
      <button matButton (click)="logout()">Logout</button>
    </div>

    <router-outlet></router-outlet>
  } @else {
    <div class="login-page">
      <mat-card class="login-card">
        <mat-card-header>
          <h1>Metronome</h1>
        </mat-card-header>
        <mat-card-content>
          <button mat-raised-button color="primary" (click)="login()">
            Login
          </button>
        </mat-card-content>
      </mat-card>
    </div>
  }
}
