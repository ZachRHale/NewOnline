@if (score) {
<h2>{{ score?.title }}</h2>
}
@for (item of measures; track item.number) {
<app-measure
  [top]="item.top"
  [bottom]="item.bottom"
  [tempo]="item.tempo"
  [measureNumber]="item.number ?? 0"
  (playCompleted)="onPlayCompleted(item.number ?? 1)"></app-measure>
} @empty {
<li>There are no items.</li>
}
