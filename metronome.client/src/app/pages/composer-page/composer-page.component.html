<h1>Composers</h1>

@if (isLoading) {
    <mat-spinner></mat-spinner>
} @else {
    <button mat-flat-button color="primary" (click)="openCreateComposerDialog()">Create Composer</button>
    <table mat-table [dataSource]="composers" class="mat-elevation-z8">

    <!-- Name Column -->
    <ng-container matColumnDef="firstName">
        <th mat-header-cell *matHeaderCellDef> First Name </th>
        <td mat-cell *matCellDef="let composer"> {{composer.firstName}} </td>
    </ng-container>

    <!-- Last Name Column -->
    <ng-container matColumnDef="lastName">
        <th mat-header-cell *matHeaderCellDef> Last Name </th>
        <td mat-cell *matCellDef="let composer"> {{composer.lastName}} </td>
    </ng-container>

<ng-container matColumnDef="actions">
  <th mat-header-cell *matHeaderCellDef> Actions </th>
  <td mat-cell *matCellDef="let row">
    <button mat-icon-button color="primary" (click)="editComposer(row)" matTooltip="Edit">
      <mat-icon>edit</mat-icon>
    </button>
    <!-- <button mat-icon-button color="warn" (click)="delete(row)" matTooltip="Delete">
      <mat-icon>delete</mat-icon>
    </button> -->
  </td>
</ng-container>

    <tr mat-header-row *matHeaderRowDef="['firstName', 'lastName', 'actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['firstName', 'lastName', 'actions'];"></tr>
    </table>
}
