<h1>Scores by {{ composer?.firstName }} {{ composer?.lastName }}</h1>

@if (isLoading) {
  <mat-spinner></mat-spinner>
} @else {
  <table mat-table [dataSource]="scores" class="mat-elevation-z8">
    <!-- Title Column -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let score">
        <button matButton (click)="viewScore(score.id)">
          {{ score.title }}
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['title']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['title']"></tr>
  </table>
}
